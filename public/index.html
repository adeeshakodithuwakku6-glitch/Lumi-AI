<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7fb">
    <meta name="description" content="A friendly AI companion for Sinhala and English.">
    <title>Lumi AI — Your everyday companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Lumi AI home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <path d="M16 3.5 18.9 12l8.6 3-8.6 2.9-2.9 8.6-2.9-8.6-8.6-2.9 8.6-3L16 3.5Z" fill="currentColor"/>
              <path d="m25.4 4.5 1.2 3.2 3.2 1.2-3.2 1.1-1.2 3.3-1.1-3.3-3.3-1.1 3.3-1.2 1.1-3.2Z" fill="currentColor" opacity=".65"/>
            </svg>
          </span>
          <span class="brand-name">lumi<span>ai</span></span>
        </a>
        <div class="topbar-actions">
          <span class="language-pill"><span class="status-dot"></span> Sinhala &amp; English</span>
          <button class="new-chat-button" id="new-chat" type="button" aria-label="Start a new chat">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <span>New chat</span>
          </button>
        </div>
      </header>

      <main class="chat-layout">
        <section class="conversation" aria-label="Conversation with Lumi AI">
          <div class="conversation-scroll" id="conversation-scroll">
            <div class="welcome" id="welcome">
              <div class="welcome-icon" aria-hidden="true">
                <svg viewBox="0 0 48 48" fill="none">
                  <path d="m24 5 4.2 12.3L40.5 22l-12.3 4.2L24 38.5l-4.2-12.3L7.5 22l12.3-4.7L24 5Z" fill="currentColor"/>
                  <path d="m38 8 1.6 4.4L44 14l-4.4 1.6L38 20l-1.6-4.4L32 14l4.4-1.6L38 8Z" fill="currentColor" opacity=".55"/>
                </svg>
              </div>
              <p class="eyebrow">YOUR EVERYDAY AI COMPANION</p>
              <h1>Ayubowan! <span>ආයුබෝවන්!</span></h1>
              <p class="welcome-copy">I'm Lumi AI. Ask me anything in Sinhala or English — I'm here to help.</p>
              <div class="suggestions" aria-label="Try asking">
                <button class="suggestion" type="button" data-prompt="Help me plan a productive day">Help me plan my day <span>↗</span></button>
                <button class="suggestion" type="button" data-prompt="Explain artificial intelligence in simple Sinhala">සරලව AI ගැන කියන්න <span>↗</span></button>
                <button class="suggestion" type="button" data-prompt="Give me a simple Python project idea">A Python project idea <span>↗</span></button>
              </div>
            </div>
            <div class="messages" id="messages" aria-live="polite"></div>
          </div>

          <div class="composer-area">
            <p class="error-message" id="error-message" role="alert" hidden></p>
            <form class="composer" id="chat-form">
              <label class="sr-only" for="message-input">Message Lumi AI</label>
              <textarea id="message-input" name="message" rows="1" maxlength="12000" placeholder="Message Lumi AI... / Lumi AI ට පණිවිඩයක් යවන්න..." required></textarea>
              <div class="composer-footer">
                <span class="composer-hint">Enter to send <span class="hint-divider">·</span> Shift + Enter for a new line</span>
                <button class="send-button" id="send-button" type="submit" aria-label="Send message">
                  <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 15.8V4.2M5.5 8.7 10 4.2l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </div>
            </form>
            <footer class="footer">Lumi AI can make mistakes. Check important information. <span>·</span> Powered by Gemini</footer>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js" defer></script>
    <script src="/app.js" defer></script>
  </body>
</html>
