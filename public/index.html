<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#061316">
    <meta name="description" content="Talk with Lumi AI in Sinhala or English.">
    <title>Lumi AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main class="face-only">
      <button class="visualizer" id="mic-button" data-state="idle" type="button" aria-label="Start talking to Lumi AI" aria-describedby="keyboard-shortcuts">
        <span class="visualizer-grid" aria-hidden="true"></span>
        <span class="face-halo" aria-hidden="true"></span>
        <svg class="ai-face" viewBox="0 0 280 250" aria-hidden="true">
          <defs>
            <linearGradient id="face-stroke" x1="30" y1="30" x2="250" y2="230" gradientUnits="userSpaceOnUse">
              <stop stop-color="#b5fff6"/><stop offset=".48" stop-color="#40e7d2"/><stop offset="1" stop-color="#4f9cff"/>
            </linearGradient>
            <radialGradient id="face-glow"><stop stop-color="#35e4d4" stop-opacity=".2"/><stop offset="1" stop-color="#35e4d4" stop-opacity="0"/></radialGradient>
          </defs>
          <ellipse cx="140" cy="127" rx="120" ry="115" fill="url(#face-glow)"/>
          <g class="face-lines" fill="none" stroke="url(#face-stroke)" stroke-linecap="round" stroke-linejoin="round">
            <path class="face-outline" d="M140 20c-52 0-88 38-88 96 0 58 34 106 88 117 54-11 88-59 88-117 0-58-36-96-88-96Z"/>
            <path d="M140 21v211M52 116h176M65 72l150 112M215 72 65 184M76 45l128 164M204 45 76 209"/>
            <path d="M52 116c24-22 49-33 74-31 6 1 11 3 14 6 3-3 8-5 14-6 25-2 50 9 74 31"/>
            <path d="M67 149c22 9 44 14 65 14 3 0 6-1 8-3 2 2 5 3 8 3 21 0 43-5 65-14"/>
            <path d="M111 111c-10-6-21-6-31 1m89-1c10-6 21-6 31 1"/>
            <path d="M119 181c13 8 29 8 42 0m-21-18v25"/>
            <path d="M91 96 111 111 91 127m98-31-20 15 20 16"/>
            <path d="m99 57 12 54 29-20 29 20 12-54M70 128l21 21-13 25m132-46-21 21 13 25"/>
          </g>
          <g class="face-nodes" fill="#adfff4">
            <circle cx="140" cy="20" r="2"/><circle cx="52" cy="116" r="2"/><circle cx="228" cy="116" r="2"/>
            <circle cx="140" cy="233" r="2"/><circle cx="111" cy="111" r="2"/><circle cx="169" cy="111" r="2"/>
            <circle cx="140" cy="160" r="2"/><circle cx="140" cy="187" r="2"/>
          </g>
        </svg>
        <span class="visualizer-orbit orbit-one" aria-hidden="true"></span>
        <span class="visualizer-orbit orbit-two" aria-hidden="true"></span>
      </button>
      <p class="sr-only" id="visualizer-status" role="status" aria-live="polite">Ready</p>
      <p class="sr-only" id="keyboard-shortcuts">Tap the face to speak. Press L to switch language, M to mute or unmute voice, T to type, and Escape for a new conversation.</p>
      <button class="corner-mic" id="corner-mic" type="button" aria-label="Start talking to Lumi AI" title="Talk to Lumi AI">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="9" y="3" width="6" height="12" rx="3" stroke="currentColor" stroke-width="1.7"/>
          <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 18v3m-4 0h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>
      <form class="text-fallback" id="chat-form" hidden>
        <label class="sr-only" for="message-input">Type a message for Lumi AI</label>
        <textarea id="message-input" name="message" rows="1" maxlength="12000"></textarea>
        <button class="send-button" id="send-button" type="submit" aria-label="Send message">Send</button>
      </form>
      <p class="sr-only" id="error-message" role="alert" hidden></p>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
